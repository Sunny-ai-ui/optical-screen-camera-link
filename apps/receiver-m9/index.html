<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>M9 3×3 Optical Receiver</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#e9eef7;background:#0b0f16}
    *{box-sizing:border-box} body{margin:0;background:#0b0f16} main{width:min(1100px,100%);margin:auto;padding:14px}
    .panel{margin-top:14px;border:1px solid #263246;background:#111923;border-radius:14px;padding:14px}
    .toolbar,.status{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
    button,select,label{border:1px solid #2d3a4d;background:#172131;color:#f2f6fb;border-radius:10px;padding:10px 14px;font:inherit}
    button:disabled{opacity:.45}.pill{padding:7px 10px;border-radius:999px;background:#1d2735;border:1px solid #334157;font-size:13px}
    .pill.good{background:#103322;border-color:#1d6f49;color:#b9f5d8}.pill.work{background:#2d2810;border-color:#665b20;color:#fff0a6}.pill.bad{background:#3a171a;border-color:#7b2a31;color:#ffc5ca}
    #video,#highSource{display:none} #source{width:100%;height:auto;background:#05070a;border-radius:12px}
    #roi{width:100%;max-width:768px;height:auto;background:#000;border:1px solid #2b3749}
    .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin-top:12px}
    .metric{padding:10px;border-radius:10px;background:#0d141d;border:1px solid #202c3c}.metric span{display:block;color:#8897aa;font-size:12px}.metric strong{display:block;margin-top:4px;font-family:ui-monospace,Consolas,monospace;word-break:break-word}
    #output{white-space:pre-wrap;word-break:break-word;min-height:90px;padding:12px;border-radius:10px;background:#080d13;border:1px solid #202c3c}
    #log{max-height:220px;overflow:auto;font:12px ui-monospace,Consolas,monospace;color:#9fb0c5}
    .hint{color:#9aa8bb;line-height:1.5} a{color:#8fc2ff}
  </style>
</head>
<body><main>
  <h1>M9 3×3 Optical Receiver</h1>
  <p class="hint">Experimental lightweight parallel receiver. Production G32 remains available as fallback.</p>
  <div class="toolbar">
    <button id="start">Start Camera</button><button id="stop" disabled>Stop Camera</button>
    <button id="reset">Reset Transfer</button>
    <select id="cameraSelect" disabled><option>Camera permission required</option></select>
    <label><input id="showRoi" type="checkbox"> Show logical ROI</label>
    <a href="../sender-m9/">Open M9 Sender</a><a href="../receiver-v3/">G32 Production Receiver</a>
  </div>
  <section class="panel">
    <div class="status">
      <span id="cameraState" class="pill">Camera idle</span>
      <span id="trackingState" class="pill">No frame</span>
      <span id="decodeState" class="pill">Waiting</span>
      <span id="transferState" class="pill">Waiting</span>
    </div>
    <canvas id="source"></canvas><video id="video" playsinline muted></video><canvas id="highSource"></canvas>
    <div id="metrics" class="metrics"></div>
  </section>
  <section id="roiPanel" class="panel" hidden><h2>Rectified M9 ROI</h2><canvas id="roi" width="768" height="768"></canvas></section>
  <section class="panel"><h2>Recovered data</h2><div id="output">Waiting for M9 fountain transfer…</div></section>
  <section class="panel"><h2>Receiver log</h2><div id="log"></div></section>
</main><script type="module" src="./app.js"></script></body></html>

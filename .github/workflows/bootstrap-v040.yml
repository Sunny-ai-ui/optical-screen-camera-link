name: Bootstrap v0.4.0 Source

on:
  push:
    paths:
      - '.github/workflows/bootstrap-v040.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source-*.b64 > /tmp/optical-v0.4.0-source.b64
          base64 --decode /tmp/optical-v0.4.0-source.b64 > /tmp/optical-v0.4.0-source.zip
          mkdir -p /tmp/optical-source
          unzip -oq /tmp/optical-v0.4.0-source.zip -d /tmp/optical-source
          cp -a /tmp/optical-source/. .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-v040.yml

      - name: Verify release tests
        run: npm test

      - name: Commit v0.4.0 source baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "release: publish v0.4.0 source baseline"
          git push origin HEAD:main
